name: Rust CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Release test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile all targets
        shell: bash
        run: |
          set +e
          cargo build --release --all-targets >build.log 2>&1
          status=$?
          cat build.log
          if [ "$status" -ne 0 ]; then
            # Keep compiler diagnostics retrievable through the Checks API when
            # an environment cannot download the otherwise-standard raw log.
            encoded="$(sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g' build.log)"
            echo "::error title=Rust compilation failed::$encoded"
            exit "$status"
          fi
      - name: Run correctness tests, including full start-position perft(6)
        # Release generation is fast enough for the 119,060,324-node reference
        # count, so every push validates the complete required perft suite.
        shell: bash
        run: |
          set +e
          cargo test --release >test.log 2>&1
          status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            encoded="$(sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g' test.log)"
            echo "::error title=Rust tests failed::$encoded"
            exit "$status"
          fi
      - name: Exercise command-line perft
        run: target/release/chess-engine perft --depth 3
      - name: Exercise UCI handshake
        run: |
          output="$(printf 'uci\nisready\nquit\n' | timeout 10s target/release/chess-uci)"
          printf '%s\n' "$output"
          grep -qx 'uciok' <<<"$output"
          grep -qx 'readyok' <<<"$output"
      - name: Capture CLI, UCI, and benchmark examples
        shell: bash
        run: |
          emit_notice() {
            local title="$1"
            local text="$2"
            local encoded
            encoded="$(printf '%s' "$text" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::notice title=$title::$encoded"
          }
          cli="$(target/release/chess-engine analyze --fen '7k/5K2/6Q1/8/8/8/8/8 w - - 0 1' --depth 3 --multipv 1 --hash 4)"
          uci="$({ printf 'uci\nisready\nposition fen 7k/5K2/6Q1/8/8/8/8/8 w - - 0 1\ngo depth 3\n'; sleep 1; printf 'quit\n'; } | timeout 10s target/release/chess-uci)"
          perft_bench="$(cargo bench --bench perft_bench)"
          search_bench="$(cargo bench --bench search_bench)"
          printf '%s\n%s\n%s\n%s\n' "$cli" "$uci" "$perft_bench" "$search_bench"
          emit_notice 'Captured CLI output' "$cli"
          emit_notice 'Captured UCI output' "$uci"
          emit_notice 'Captured benchmarks' "$perft_bench\n$search_bench"

  full-perft:
    name: Full depth-6 perft validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release start_position_perft_six -- --ignored
